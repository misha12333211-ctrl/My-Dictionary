<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lexicon Flow — Стильный словарь английского</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Babel for running TypeScript directly in client -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-full flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header / Navigation -->
  <header class="sticky top-0 z-40 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="p-2 bg-brand-500/10 text-brand-500 rounded-xl border border-brand-500/20">
          <i data-lucide="book-marked" class="w-6 h-6"></i>
        </div>
        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
          Lexicon<span class="text-brand-500">Flow</span>
        </span>
      </div>

      <!-- Tab Switcher -->
      <nav class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/50 text-xs sm:text-sm">
        <button id="nav-dictionary" onclick="switchTab('dictionary')" class="tab-btn active">
          <i data-lucide="list" class="w-4 h-4 mr-1 sm:mr-1.5 inline"></i>Словарь
        </button>
        <button id="nav-cards" onclick="switchTab('cards')" class="tab-btn">
          <i data-lucide="layers" class="w-4 h-4 mr-1 sm:mr-1.5 inline"></i>Карточки
        </button>
        <button id="nav-sprint" onclick="switchTab('sprint')" class="tab-btn">
          <i data-lucide="zap" class="w-4 h-4 mr-1 sm:mr-1.5 inline"></i>Спринт
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-24 sm:pb-8">
    
    <!-- STATS BANNER -->
    <section class="grid grid-cols-3 gap-3 mb-6">
      <div class="stat-card">
        <span class="text-xs text-slate-400">Всего слов</span>
        <span id="stat-total" class="text-xl font-bold text-white">0</span>
      </div>
      <div class="stat-card">
        <span class="text-xs text-slate-400">Изучено</span>
        <span id="stat-learned" class="text-xl font-bold text-brand-500">0</span>
      </div>
      <div class="stat-card">
        <span class="text-xs text-slate-400">Точность</span>
        <span id="stat-accuracy" class="text-xl font-bold text-amber-400">0%</span>
      </div>
    </section>

    <!-- VIEW 1: DICTIONARY -->
    <section id="view-dictionary" class="view-panel space-y-4">
      <!-- Add Word Form -->
      <form id="add-word-form" class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/60 shadow-xl space-y-3">
        <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4 text-brand-500"></i> Добавить новое слово
        </h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="text" id="input-word" placeholder="Word (e.g. Resilience)" required class="input-field" />
          <input type="text" id="input-translation" placeholder="Перевод (напр. Устойчивость)" required class="input-field" />
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <input type="text" id="input-context" placeholder="Пример предложения (опционально)" class="input-field" />
          <select id="input-tag" class="input-field">
            <option value="General">General</option>
            <option value="Work">Work & Tech</option>
            <option value="Travel">Travel</option>
            <option value="Slang">Slang</option>
          </select>
        </div>
        <button type="submit" class="btn-primary w-full py-2.5 flex items-center justify-center gap-2 font-medium">
          <i data-lucide="check" class="w-4 h-4"></i> Сохранить слово
        </button>
      </form>

      <!-- Tools Bar (Search & Export) -->
      <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="relative w-full sm:w-72">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="search-input" oninput="renderDictionary()" placeholder="Поиск по словарю..." class="input-field pl-9 py-2 text-sm" />
        </div>
        <div class="flex gap-2 w-full sm:w-auto justify-end">
          <button onclick="exportWords()" class="btn-secondary text-xs py-2 px-3 flex items-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Экспорт
          </button>
          <label class="btn-secondary text-xs py-2 px-3 flex items-center gap-1.5 cursor-pointer">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i> Импорт
            <input type="file" id="import-file" onchange="importWords(event)" class="hidden" accept=".json" />
          </label>
        </div>
      </div>

      <!-- Words List -->
      <div id="words-list" class="space-y-2.5"></div>
    </section>

    <!-- VIEW 2: FLASHCARDS -->
    <section id="view-cards" class="view-panel hidden">
      <div id="card-container" class="max-w-md mx-auto my-8">
        <!-- Flashcard rendering dynamically -->
      </div>
    </section>

    <!-- VIEW 3: SPRINT GAME -->
    <section id="view-sprint" class="view-panel hidden">
      <div id="sprint-container" class="max-w-md mx-auto bg-slate-800/60 p-6 rounded-3xl border border-slate-700/60 text-center shadow-2xl">
        <!-- Sprint gameplay rendering dynamically -->
      </div>
    </section>

  </main>

  <script type="text/babel" src="app.ts"></script>
</body>
</html>
